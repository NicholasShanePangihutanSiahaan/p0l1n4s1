# Satu mode untuk FSM dan controller: home_relative atau terrain_following.
/**:
  ros__parameters:
    altitude_mode: home_relative

pcl_proc_node:
  ros__parameters:
    use_transform_pcl: false
    min_sensor_range: 0.3
    max_sensor_range: 15.0
    voxel_leaf_size: 0.20
    processing_period_ms: 500
    camera_offset_x: 0.0
    camera_offset_y: 0.0
    camera_offset_z: 0.0
    camera_mount_roll: 0.0
    camera_mount_pitch: 0.0
    camera_mount_yaw: 0.0

tree_mapper:
  ros__parameters:
    frame_id: odom
    merge_distance: 1.0
    minimum_seen_count: 3
    min_radius: 0.10
    max_radius: 0.65
    min_height: 0.8
    max_height: 8.0
    max_trunk_base_height: 0.65
    min_cylinder_confidence: 0.20
    position_alpha: 0.25

mission_state_machine:
  ros__parameters:
    # X: takeoff dan ketinggian navigasi sebelum/sesudah orbit.
    flight_altitude: 1.5
    # Y: ketinggian pra-orbit terhadap home, sama dengan real.yaml.
    pre_orbit_altitude: 2.5
    altitude_transition_tolerance: 1.0
    altitude_transition_hold_time: 1.5
    mission_mode: single_tree
    # Sama dengan konfigurasi real: berhenti 1.5 m dari pusat batang.
    approach_distance: 1.5
    tree_distance_tolerance: 0.5
    approach_goal_tolerance: 0.15
    verification_retry_limit: 3
    require_safety_monitor: false
    auto_start: false
    state_timeout: 300.0
    pose_timeout: 5.0
    post_takeoff_hover_time: 2.0
    require_vision_before_start: false
    vision_pose_topic: /mavros/vision_pose/pose
    vision_pose_timeout: 1.0
    vision_warmup_time: 0.0
    abort_mode: ""

dynamic_orbit_controller:
  ros__parameters:
    orbit_radius: 1.5
    orbit_altitude: 1.5
    orbit_velocity: 0.25
    orbit_timeout: 180.0
    radial_tolerance: 0.3
    yaw_offset: 0.0
    completion_tolerance_degrees: 2.0

flight_manager:
  ros__parameters:
    altitude_source: rangefinder
    hover_tolerance: 1.0
    rangefinder_topic: /simulation/rangefinder
    rangefinder_timeout: 1.0
    rangefinder_min_valid: 0.08
    rangefinder_max_valid: 8.0
    rangefinder_altitude_offset: 0.0

position_setpoint_controller:
  ros__parameters:
    publish_rate: 20.0
    max_horizontal_step: 0.10
    max_vertical_step: 0.05
    target_timeout: 0.75
    output_frame: map
    # Hanya dipakai pada mode terrain_following. Target AGL berasal dari FSM.
    rangefinder_topic: /simulation/rangefinder
    rangefinder_timeout: 0.5
    rangefinder_min_valid: 0.08
    rangefinder_max_valid: 8.0
    rangefinder_altitude_offset: 0.0
    range_filter_alpha: 0.35
    range_median_window: 5
    minimum_tilt_cosine: 0.7
    max_terrain_correction: 1.0
    max_terrain_target_rate: 0.5

velocity_controller:
  ros__parameters:
    minimum_control_altitude: 0.20
    # Harus lebih kecil dari approach_goal_tolerance (0.15 m), agar
    # controller tidak berhenti sebelum FSM menyatakan titik tercapai.
    goal_threshold: 0.08

mission_safety_monitor:
  ros__parameters:
    pointcloud_topic: /zed2i/depth/points
    range_topic: /simulation/rangefinder
    require_rangefinder: true
    pose_timeout: 5.0
    cloud_timeout: 3.0
    range_timeout: 5.0
    min_range: 0.08
    max_range: 8.0

mission_analyzer:
  ros__parameters:
    output_directory: ~/beehive_mission_reports/sim
    map_frame: map
    sample_period: 0.20
    console_period: 2.0
    autosave_period: 10.0
    rangefinder_topic: /simulation/rangefinder
    expected_takeoff_altitude: 1.9
    expected_approach_distance: 1.5
    expected_orbit_radius: 1.5

priest_dyn_node:
  ros__parameters:
    plan_rate_hz: 0.333
    goal_tolerance: 0.15
    horizon_seconds: 5.0
    num_samples: 50
    num_batch: 100
    max_obstacles: 100
    reference_samples: 300
    cem_iterations: 13

    # Visualisasi di rviz untuk trajectory
    publish_elite_trajectories: true
    elite_marker_alpha: 0.20
    elite_marker_line_width: 0.015

    v_max: 0.90
    v_min: 0.0
    a_max: 1.3
    v_des: 0.55
    weight_smoothness: 1.3 # Lebih tinggi prioritaskan lebih sedikit belokan
    weight_track: 0.001 # Lebih tinggi prioritaskan mengikuti rute
    weight_clearance: 1.7 # Lebih tingi prioritaskan mengihndari obstacle
    robot_radius: 0.4
    safety_margin: 0.20
    goal_clearance: 0.08
    goal_lateral_weight: 0.0
    odom_timeout: 20.0
    obstacle_timeout: 20.0
    max_solve_age: 30.0
    max_start_drift: 0.3
    require_obstacles: false
    device: cpu
    seed: 0

    is_log_CEM_progress: True
    use_safety: true

    # Pada WAIT_ORBIT, PRIEST mengikuti reference Path lingkaran dari bridge.
    # State lain memakai linear_goal dari FSM.
    reference_trajectory_states: ["WAIT_ORBIT"]

priest_avoidance_controller:
  ros__parameters:
    publish_rate: 20.0
    path_timeout: 20.0
    waypoint_lookahead: 0.8
    goal_republish_period: 0.5
    minimum_obstacle_radius: 0.1
    minimum_obstacle_half_height: 0.25
    orbit_radius: 2.7
    orbit_reference_points: 120
    reference_republish_period: 0.5
